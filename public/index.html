<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Cup Ladder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>World Cup Ladder</h1>
      <div class="topbar-actions">
        <span id="last-updated" class="last-updated">Last updated: —</span>
        <button id="sync-btn" type="button">Sync</button>
      </div>
    </header>

    <!-- Transient status line (syncing / sync failed messages) -->
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <main>
      <!-- Data available -->
      <section id="state-data">
        <div class="tabs" role="tablist" aria-label="Graphs">
          <button
            id="tab-ranking"
            class="tab is-active"
            role="tab"
            type="button"
            aria-selected="true"
            aria-controls="panel-ranking"
          >
            Ranking
          </button>
          <button
            id="tab-timeseries"
            class="tab"
            role="tab"
            type="button"
            aria-selected="false"
            aria-controls="panel-timeseries"
          >
            Over Time
          </button>
        </div>

        <!-- Tab 1: per-player points bar chart -->
        <div
          id="panel-ranking"
          class="tab-panel"
          role="tabpanel"
          aria-labelledby="tab-ranking"
        >
          <div id="graph" class="graph" aria-label="Points ranking graph"></div>
        </div>

        <!-- Tab 2: score over time -->
        <div
          id="panel-timeseries"
          class="tab-panel"
          role="tabpanel"
          aria-labelledby="tab-timeseries"
          hidden
        >
          <div class="chart-controls">
            <span class="chart-controls-label">Show:</span>
            <div class="toggle-group" role="group" aria-label="Number of players">
              <button type="button" class="toggle is-active" data-topn="5">Top 5</button>
              <button type="button" class="toggle" data-topn="10">Top 10</button>
              <button type="button" class="toggle" data-topn="15">Top 15</button>
              <button type="button" class="toggle" data-topn="all">All</button>
            </div>
          </div>
          <div id="chart-timeseries" class="timeseries" aria-label="Score over time"></div>
        </div>

        <table class="ladder" aria-label="Player ladder">
          <thead>
            <tr>
              <th class="col-rank">Rank</th>
              <th class="col-name">Player</th>
              <th class="col-category">Category</th>
              <th class="col-points">Points</th>
            </tr>
          </thead>
          <tbody id="ladder-body"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
