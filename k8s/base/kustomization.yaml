apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: world-cup-ladder
    includeSelectors: false

images:
  - name: world-cup-ladder
    newName: world-cup-ladder
    newTag: latest
