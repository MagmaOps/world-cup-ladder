apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: world-cup-ladder
  labels:
    app: world-cup-ladder
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: WORLD_CUP_LADDER_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: world-cup-ladder
                port:
                  name: http
